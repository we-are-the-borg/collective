# git-cliff configuration for CHANGELOG.md, used by scripts/release.sh.
# https://git-cliff.org/docs/configuration

[changelog]
# `--prepend` cuts the old header up to this marker and writes the new one,
# so the header appears exactly once.
header_marker = "<!-- git-cliff: end of header -->"
header = """
# Changelog

All notable changes to The Collective. Versions follow [Semantic Versioning](https://semver.org);
each section lists the merged pull requests by type.

<!-- git-cliff: end of header -->
"""
# The heading carries neither a `v` nor a date: the GitHub release has the date,
# and `scripts/release.sh publish` looks the section up by `## X.Y.Z`.
# The whitespace control (`{%-`) leaves no trailing newline, so a prepended
# section is followed by exactly one blank line before the previous one.
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }}{% else %}## Unreleased{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {% if commit.breaking %}[**breaking**] {% endif %}\
  {{ commit.message | upper_first }}
{%- endfor %}
{%- endfor %}"""
trim = false

[git]
conventional_commits = true
# The history before the switch to Conventional Commits stays out.
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
# A squash merge ends its title with the pull request number in parentheses. It
# stays out: bare issue numbers of this repository are not kept in tracked files
# (scripts/public-check.sh, rule `plan-refs`). `(?m)`: the title is the first
# line of a message that usually has a body.
commit_preprocessors = [
  { pattern = "(?m) \\(#[0-9]+\\)$", replace = "" },
]
# The HTML comment only orders the groups; `striptags` removes it.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance" },
  { message = "^refactor", group = "<!-- 03 -->Refactoring" },
  { message = "^docs?", group = "<!-- 04 -->Documentation" },
  { message = "^test", group = "<!-- 05 -->Tests" },
  { message = "^style", group = "<!-- 06 -->Styling" },
  { message = "^build", group = "<!-- 07 -->Build" },
  { message = "^ci", group = "<!-- 08 -->CI" },
  { message = "^chore", group = "<!-- 09 -->Chores" },
  { message = "^revert", group = "<!-- 10 -->Reverts" },
  { message = ".*", group = "<!-- 11 -->Other" },
]
filter_commits = false
# Only release tags count; other tags (e.g. `window-and-conversation`) are ignored.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"

[bump]
# Must carry the `v`, otherwise it does not match `tag_pattern`.
initial_tag = "v1.0.0"
features_always_bump_minor = true
breaking_always_bump_major = true
