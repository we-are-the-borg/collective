name: ci

# Every PR and every push to main, without path filters: `ci` is a required
# check, and a run skipped by a filter would leave it pending forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    # The Xcode 27 image, not macos-latest (Xcode 26): the project is in
    # Xcode 27 format, and `swift test` compiles the string catalogs only
    # from Swift 6.4 on; older toolchains copy them and every plural fails.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # The tests check the mapping and the payloads against the subspace dev
      # repo (fixtures, golden files); without it they are skipped.
      SUBSPACE_DEV_DIR: ${{ github.workspace }}/subspace
    steps:
      - uses: actions/checkout@v7
      - name: Check out subspace
        uses: actions/checkout@v7
        with:
          repository: we-are-the-borg/subspace
          path: subspace
      - name: Select the newest installed Xcode
        # Decides the Swift toolchain for `swift test` and the app build. Only
        # plain versioned bundles (Xcode_27.2.app), no beta/RC suffixes.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode_<version>.app found on the runner"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: No private data
        # The subspace checkout is not tracked here, so the check skips it.
        run: |
          bash scripts/test-public-check.sh
          scripts/public-check.sh
      # Quiet: failures and the summary only. Without it the parameterized
      # tests print every argument, tens of thousands of lines.
      - name: Test SubspaceKit
        working-directory: SubspaceKit
        run: swift test --quiet
      # One test at a time: on the runner's three cores the spool tests, which
      # wait for a reader on the wall clock, time out next to 2500 others.
      - name: Test CollectiveKit
        working-directory: CollectiveKit
        run: swift test --quiet --no-parallel
      - name: Build the app
        run: >
          xcodebuild -project App/Collective.xcodeproj -scheme Collective
          -configuration Debug CODE_SIGNING_ALLOWED=NO build
