name: Bug report
description: Something in The Collective doesn't work as the README describes.
labels: [bug]
body:
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code, Codex, Both, Not agent-specific]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The Collective (Settings › About), subspace (Settings › Sources), the agent (`claude --version` / `codex --version`) and macOS.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: markdown
    attributes:
      value: |
        Screenshots and subspace's event files can show your prompts, file paths and tool output. **Don't share them unredacted**: remove paths, names and anything private first.
